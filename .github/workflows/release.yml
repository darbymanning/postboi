name: Release

# A release is a merge, not a chore afterwards.
#
# Label a PR `release:patch`, `release:minor` or `release:major` and merging it
# runs the whole sequence RELEASING.md used to walk through by hand: freeze the
# outgoing docs, bump, validate, publish to npm, tag, cut the GitHub release,
# then move the examples' pins onto it. An unlabelled merge does nothing.
#
# Pre-1.0 the bump can't be inferred — a breaking change is a *minor* here — so
# the label is the one thing a human still says. It can go on the PR at any
# point before the merge.

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Escape hatch: release main as it stands, no PR involved.
  workflow_dispatch:
    inputs:
      bump:
        description: "patch | minor | major | X.Y.Z"
        required: true
        default: patch
        type: string
      docs_before:
        description: "Commit whose docs are the outgoing version's (default: main as it stands)"
        required: false
        type: string

# One release at a time — two in flight would race on main and on the version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Freeze docs, bump, tag
    # Merged, not merely closed, and carrying a release label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the freeze + version commits and the tag to main
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # The docs freeze reads a commit from before the merge landed.
          fetch-depth: 0

      - name: Resolve the bump
        id: bump_input
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bump="$DISPATCH_BUMP"
          else
            labels="$(jq -r '.pull_request.labels[].name | ascii_downcase | select(startswith("release:"))' "$GITHUB_EVENT_PATH")"
            count="$(printf '%s' "$labels" | grep -c . || true)"
            if [ "$count" -ne 1 ]; then
              echo "✗ expected exactly one release:patch|minor|major label, found $count:" >&2
              printf '%s\n' "$labels" >&2
              exit 1
            fi
            bump="${labels#release:}"
          fi
          case "$bump" in
            patch|minor|major|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "✗ '$bump' is not patch, minor, major or X.Y.Z" >&2; exit 1 ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "▶ releasing a $bump"

      - name: Resolve the outgoing docs commit
        id: docs_before
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DISPATCH_BEFORE: ${{ inputs.docs_before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # No PR to work back from: main as it stands is the best guess, and
            # docs_before overrides it when the new version's edits already landed.
            before="${DISPATCH_BEFORE:-HEAD}"
          else
            # The commit the release PR landed on — its docs are the outgoing
            # version's, whatever the PR then changed. Squash and merge commits
            # both have main's previous tip as their first parent.
            if ! git merge-base --is-ancestor "$MERGE_SHA" HEAD; then
              echo "✗ main does not contain $MERGE_SHA — refusing to release a merge that isn't there" >&2
              exit 1
            fi
            before="$(git rev-parse "$MERGE_SHA^")"
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "▶ outgoing docs come from $(git rev-parse --short "$before")"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup env vars for type checking
        run: |
          echo "ZEPTO_TOKEN=test-token" > .env
          echo "EMAIL_FROM_ADDRESS=test@example.com" >> .env
          echo "EMAIL_TO_ADDRESS=test@example.com" >> .env

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ steps.bump_input.outputs.bump }}
        run: |
          set -euo pipefail
          npm version "$BUMP" --no-git-tag-version >/dev/null
          version="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "✗ tag v$version already exists — $version has been released" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "▶ v$version"

      # Before the version bump is committed, so the freeze is its own commit in
      # front of it — the shape every release in the history already has.
      - name: Freeze the outgoing docs
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BEFORE: ${{ steps.docs_before.outputs.before }}
        run: |
          set -euo pipefail
          prev="$(node -p "require('./src/site/config/versions.json').latest")"
          bun scripts/snapshot-docs.ts --version "$VERSION" --before "$BEFORE"
          echo "PREV=$prev" >> "$GITHUB_ENV"

      # Same gates as scripts/release.sh, and for the same reason: everything
      # after this is a push, a publish or a tag, and none of those come back.
      - name: Run linter
        run: bun run lint

      - name: Run type check
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- src/site/config/versions.json src/site/content; then
            git add src/site/config/versions.json src/site/content
            git commit -m "Freeze the $PREV docs before $VERSION goes out"
          fi

          git add package.json
          git commit -m "$VERSION"
          git tag -a "$TAG" -m "$VERSION"

      - name: Push main and the tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          for delay in 2 4 8 16 0; do
            if git push origin main && git push origin "$TAG"; then exit 0; fi
            if [ "$delay" = 0 ]; then break; fi
            echo "push failed — retrying in ${delay}s"
            sleep "$delay"
          done
          echo "✗ could not push the release to main" >&2
          echo "  Nothing was published — if main moved under the release, re-run this workflow." >&2
          exit 1

  publish:
    name: Publish
    needs: prepare
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    # Called rather than copied: npm's trusted publisher is configured against
    # the filename publish.yml, and a reusable workflow's job_workflow_ref is
    # the *called* file — so the OIDC claim still says publish.yml, whether the
    # release started from a tag push or from this merge.
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  examples:
    name: Examples catch up
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Wait for npm to serve the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if npm view "postboi@$VERSION" version >/dev/null 2>&1; then
              echo "✓ postboi@$VERSION is on npm"
              exit 0
            fi
            sleep 10
          done
          echo "✗ postboi@$VERSION never showed up on npm — the examples can't install it" >&2
          exit 1

      - name: Move the pins onto the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bun scripts/bump-examples.ts "$VERSION"

      # The installs are part of the commit, not a check that runs after it: two
      # examples track a bun.lock, and one a tsbuildinfo, that only move when
      # they install against the new pin.
      - name: Check every example against the release
        id: check
        # A broken example is a real red build, but it isn't a reason to leave
        # main pinned to the previous release — the failure is reported after
        # the pins are pushed.
        continue-on-error: true
        run: |
          set -uo pipefail
          failed=""
          for dir in examples/*/; do
            echo "── $dir"
            if ! (cd "$dir" && bun install && bun run ci); then
              failed="$failed $dir"
            fi
          done
          if [ -n "$failed" ]; then
            echo "✗ examples failing against $VERSION:$failed" >&2
            exit 1
          fi
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Commit and push the catch-up
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- examples; then
            echo "• nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u: the pins, the two tracked bun.locks and the tsbuildinfo that move
          # with them — never a build artifact an example forgot to ignore.
          git add -u examples
          git commit -m "Examples: catch up with $VERSION"
          for delay in 2 4 8 16 0; do
            if git push origin main; then exit 0; fi
            if [ "$delay" = 0 ]; then break; fi
            echo "push failed — retrying in ${delay}s"
            sleep "$delay"
          done
          echo "✗ could not push the examples catch-up to main" >&2
          exit 1

      - name: Report a broken example
        if: steps.check.outcome == 'failure'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "✗ postboi@$VERSION is published and the pins are pushed," >&2
          echo "  but an example does not build against it — see the check step above." >&2
          exit 1
