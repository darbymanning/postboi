name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup env vars for type checking
        run: |
          echo "ZEPTO_TOKEN=test-token" > .env
          echo "EMAIL_FROM_ADDRESS=test@example.com" >> .env
          echo "EMAIL_TO_ADDRESS=test@example.com" >> .env

      - name: Sync SvelteKit (generates env types)
        run: bun run prepare

      - name: Run type check
        run: bun run check

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      # A developer machine rarely carries someone else's credentials, which is how a
      # release shipped inference that read an unrelated AWS key as "send the SMS via
      # SNS" — and then missed Twilio's pair the same way, because the fix was a
      # hand-written list of names someone had thought of. This run fills the environment
      # from the registry itself, so every credential postboi knows about is present,
      # including whatever gets added next.
      - name: Run tests on a machine carrying other people's credentials
        run: bun run test
        env:
          POSTBOI_TEST_POLLUTE: "1"

      - name: Build
        run: bun run build

  # WET on purpose (each example is copy-paste-complete for its framework), which is
  # only affordable if nothing rots silently — so every example installs and runs its
  # own `ci` script (a typecheck or build, whichever is cheapest and meaningful).
  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check every example
        run: |
          set -e
          for dir in examples/*/; do
            echo "── $dir"
            (cd "$dir" && bun install && bun run ci)
          done
