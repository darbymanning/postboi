name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup env vars for type checking
        run: |
          echo "ZEPTO_TOKEN=test-token" > .env
          echo "EMAIL_FROM_ADDRESS=test@example.com" >> .env
          echo "EMAIL_TO_ADDRESS=test@example.com" >> .env

      - name: Sync SvelteKit (generates env types)
        run: bun run prepare

      - name: Run type check
        run: bun run check

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      # A developer machine rarely carries someone else's credentials, which is how a
      # release shipped inference that read an unrelated AWS key as "send the SMS via
      # SNS". These are the names the wider world sets for its own reasons — a box near
      # S3, a Slack notification action, a Mailjet SDK — and none of them may change
      # what postboi resolves. Same suite, polluted environment, so the run that would
      # have caught it happens every time rather than when someone thinks of it.
      - name: Run tests in an environment carrying other people's credentials
        run: bun run test
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_REGION: eu-west-2
          SMTP_HOST: smtp.example.com
          SMTP_USER: someone
          SMTP_PASS: something
          CLOUDFLARE_API_TOKEN: cf-token
          CLOUDFLARE_ACCOUNT_ID: cf-account
          SLACK_WEBHOOK_URL: https://hooks.slack.com/services/T000/B000/EXAMPLE
          DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/000/EXAMPLE
          TEAMS_WEBHOOK_URL: https://example.webhook.office.com/webhookb2/EXAMPLE
          TELEGRAM_BOT_TOKEN: 000:EXAMPLE
          MJ_APIKEY_PUBLIC: mj-public
          MJ_APIKEY_PRIVATE: mj-private

      - name: Build
        run: bun run build

  # WET on purpose (each example is copy-paste-complete for its framework), which is
  # only affordable if nothing rots silently — so every example installs and runs its
  # own `ci` script (a typecheck or build, whichever is cheapest and meaningful).
  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check every example
        run: |
          set -e
          for dir in examples/*/; do
            echo "── $dir"
            (cd "$dir" && bun install && bun run ci)
          done
