name: Publish

on:
  push:
    tags: ["v*"]
  # Called by release.yml once it has bumped, tagged and pushed. Publishing lives
  # here rather than there because npm's trusted publisher names this filename,
  # and a reusable workflow's OIDC claim points at the file that runs the job.
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to publish (must match package.json)"
        required: true
        type: string
  # Fallback for environments that can't push tags (e.g. remote sandboxes):
  # run on main after the version-bump commit lands, and this workflow derives
  # the tag from package.json and creates it along with the release.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # When called, github.ref is still the caller's (a merged PR's merge
          # ref) — the tag is the thing being published.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs npm >= 11.5.1 — Node 24 bundles 11.16+, so no npm
      # upgrade step (in-place `npm install -g npm@latest` corrupts its own install
      # across major bumps, e.g. 11 → 12 lost sigstore and broke provenance).
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "✗ tag $tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup env vars for type checking
        run: |
          echo "ZEPTO_TOKEN=test-token" > .env
          echo "EMAIL_FROM_ADDRESS=test@example.com" >> .env
          echo "EMAIL_TO_ADDRESS=test@example.com" >> .env

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      # No token — auth is OIDC via the trusted publisher configured on npmjs.com,
      # which also attaches provenance to the package. An already-published
      # version is skipped ONLY if npm's copy came from this exact commit — that
      # keeps a re-run a re-run without letting a moved tag paint a stale
      # publish green.
      - name: Publish to npm
        run: |
          if published_head="$(npm view "postboi@$VERSION" gitHead 2>/dev/null)"; then
            head="$(git rev-parse HEAD)"
            if [ "$published_head" = "$head" ]; then
              echo "• postboi@$VERSION is already on npm, from this exact commit — nothing to publish"
            else
              echo "✗ postboi@$VERSION is already on npm, published from ${published_head:-an unknown commit} — not $head." >&2
              echo "  npm will keep serving those bits; releasing this commit needs a new version." >&2
              exit 1
            fi
          else
            npm publish
          fi

      # On dispatch runs the tag doesn't exist yet — gh creates it at this commit.
      # (Tags created with the workflow's own token don't re-trigger this workflow,
      # which is why release.yml calls this workflow instead of pushing a tag at it.)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "• release $TAG already exists"
            exit 0
          fi
          args=(--title "${TAG#v}" --generate-notes)
          if [ -z "$INPUT_TAG" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${args[@]}"
